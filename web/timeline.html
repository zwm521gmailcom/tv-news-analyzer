<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV News — AI 市场洞察</title>
<style>
:root {
  --bg-primary:    #0d0e14;
  --bg-card:       #12131e;
  --bg-card-hover: #181928;
  --bg-filter:     #0f1019;
  --border:        rgba(113,50,245,0.15);
  --border-card:   rgba(113,50,245,0.12);
  --purple:        #7132f5;
  --purple-dark:   #5741d8;
  --purple-subtle: rgba(113,50,245,0.12);
  --green:         #149e61;
  --green-subtle:  rgba(20,158,97,0.14);
  --red:           #e84040;
  --red-subtle:    rgba(232,64,64,0.14);
  --yellow:        #f5a623;
  --yellow-subtle: rgba(245,166,35,0.14);
  --text-primary:  #ffffff;
  --text-secondary:#9497a9;
  --text-muted:    #5c5f75;
  --radius-card:   16px;
  --font-ui:      'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  /* 整个 body 自然滚动 — topbar / period-section / main 一起按文档流排 */
}

/* ── Top Bar ── */
.topbar {
  background: rgba(13,14,20,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 1000;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.nav-links { display: flex; gap: 4px; }
.nav-link { padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none; transition: all 0.2s; }
.nav-link:hover { background: var(--purple-subtle); color: var(--purple); }
.nav-link.active { background: var(--purple-subtle); color: var(--purple); }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.clock { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.live-badge { display: flex; align-items: center; gap: 5px; background: var(--green-subtle); border: 1px solid rgba(20,158,97,0.3); border-radius: 20px; padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--green); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse-dot 1.5s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.75); } }
.refresh-btn { background: var(--purple-subtle); border: 1px solid var(--border); color: var(--purple); border-radius: 12px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.refresh-btn:hover { background: var(--purple); color: #fff; }

/* ── Main ── */
.main-content { flex: 0 0 auto; padding: 24px; min-height: 60vh; }

/* ── Hero Section ── */
.hero-section {
  background: linear-gradient(135deg, rgba(113,50,245,0.2) 0%, rgba(113,50,245,0.05) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 24px;
  margin-bottom: 24px;
}
.hero-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.hero-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.hero-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
.badge-ai { background: var(--purple-subtle); color: var(--purple); }
.badge-fallback { background: rgba(149,151,169,0.15); color: var(--text-muted); }
.hero-theme { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; line-height: 1.3; }
.hero-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }
.hero-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.hero-symbols { display: flex; gap: 6px; flex-wrap: wrap; }
.hero-symbol { background: var(--bg-card); border: 1px solid var(--border); padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--purple); }
.hero-outlook {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: 12px;
  border-left: 3px solid var(--purple);
}
.hero-outlook-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 6px; }
.hero-outlook-text { font-size: 14px; color: var(--text-primary); line-height: 1.6; }

/* ── Risk Banner ── */
.risk-banner {
  display: flex; align-items: center; gap: 12px;
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 12px;
}
.risk-banner.high { background: var(--red-subtle); border: 1px solid rgba(232,64,64,0.3); }
.risk-banner.medium { background: var(--yellow-subtle); border: 1px solid rgba(245,166,35,0.3); }
.risk-banner.low { background: var(--green-subtle); border: 1px solid rgba(20,158,97,0.3); }
.risk-icon { font-size: 22px; }
.risk-info { flex: 1; }
.risk-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.risk-banner.high .risk-label { color: var(--red); }
.risk-banner.medium .risk-label { color: var(--yellow); }
.risk-banner.low .risk-label { color: var(--green); }
.risk-desc { font-size: 12px; color: var(--text-muted); }

/* ── Insights Grid ── */
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.insights-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 24px; }
.viewpoints-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 24px; }
.viewpoint-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-card); padding: 14px; }
.viewpoint-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.viewpoint-theme { font-size: 14px; font-weight: 700; color: var(--text-primary); flex: 1; line-height: 1.4; }
.viewpoint-risk { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; }
.viewpoint-risk.high { background: var(--red-subtle); color: var(--red); }
.viewpoint-risk.medium { background: var(--yellow-subtle); color: var(--yellow); }
.viewpoint-risk.low { background: var(--green-subtle); color: var(--green); }
.viewpoint-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 8px; }
.viewpoint-symbols { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.viewpoint-symbols .hero-symbol { background: var(--purple-subtle); color: var(--purple); font-size: 11px; padding: 3px 8px; border-radius: 4px; }
.viewpoint-outlook { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.insight-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.insight-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.insight-card.type-correlation::before { background: var(--purple); }
.insight-card.type-warning::before { background: var(--red); }
.insight-card.type-surveillance::before { background: var(--yellow); }
.insight-card.type-anomaly::before { background: var(--yellow); }
.insight-impact {
  position: absolute;
  top: 12px; right: 12px;
  font-size: 11px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
}
.impact-bullish { background: var(--green-subtle); color: var(--green); }
.impact-bearish { background: var(--red-subtle); color: var(--red); }
.impact-warning { background: var(--yellow-subtle); color: var(--yellow); }
.impact-volatility { background: rgba(149,151,169,0.15); color: var(--text-secondary); }
.insight-type { font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; }
.insight-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; line-height: 1.4; }
.insight-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
.insight-prediction {
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg-primary);
  padding: 10px 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  border-left: 3px solid var(--yellow);
  line-height: 1.5;
}
.insight-footer { display: flex; align-items: center; justify-content: space-between; }
.insight-symbols { display: flex; gap: 4px; flex-wrap: wrap; }
.insight-symbol { font-size: 11px; background: var(--bg-primary); padding: 3px 7px; border-radius: 4px; color: var(--text-secondary); }
.insight-confidence { font-size: 11px; color: var(--text-muted); }

/* ── Symbol Network ── */
.symbol-network {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 18px;
  margin-bottom: 24px;
}
.symbol-list { display: flex; gap: 8px; flex-wrap: wrap; }
.symbol-node {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-primary);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border);
  transition: all 0.2s;
  cursor: pointer;
}
.symbol-node:hover { border-color: var(--purple); transform: translateY(-2px); }
.symbol-name { font-weight: 700; color: var(--purple); }
.symbol-count { font-size: 12px; color: var(--text-muted); }

/* ── Cross Region ── */
.cross-region {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 18px;
  margin-bottom: 24px;
}
.region-link { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.region-link:last-child { border-bottom: none; }
.region-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--purple); flex-shrink: 0; }
.region-names { display: flex; align-items: center; gap: 8px; flex: 1; }
.region-name { font-size: 14px; font-weight: 600; }
.region-arrow { color: var(--text-muted); }
.region-shared { font-size: 12px; color: var(--text-muted); margin-left: auto; }
.region-count-badge {
  background: var(--purple-subtle);
  color: var(--purple);
  font-size: 11px; font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
}

/* ── Stats Row ── */
.stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 16px 20px;
  flex: 1;
  min-width: 140px;
}
.stat-value { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; font-weight: 600; }

/* ── Empty State ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text-muted); text-align: center; }
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary); }
.empty-text { font-size: 14px; line-height: 1.6; max-width: 400px; }

/* ── Toast ── */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; font-size: 13px; color: var(--text-primary); box-shadow: 0 4px 24px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; z-index: 2000; }
.toast.show { opacity: 1; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Period Insight Section (多周期 AI 洞察) ── */
.period-section {
  flex-shrink: 0;
  padding: 18px 24px 0;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border);
}
.period-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
}
.period-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.period-tabs { display: flex; gap: 4px; background: var(--bg-filter); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
.period-tab {
  padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--text-secondary); transition: all 0.15s; border: 0; background: transparent;
}
.period-tab:hover { color: var(--text-primary); }
.period-tab.active { background: var(--purple); color: #fff; }
.period-tab.disabled { opacity: 0.4; cursor: not-allowed; }
.period-refresh {
  background: var(--purple-subtle); border: 1px solid var(--border); color: var(--purple);
  padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
}
.period-refresh:hover { background: var(--purple); color: #fff; }
.period-refresh:disabled { opacity: 0.4; cursor: wait; }
.period-content { padding: 4px 0 18px; min-height: 80px; }
.period-loading, .period-error { padding: 32px; text-align: center; color: var(--text-muted); font-size: 14px; }
.period-meta {
  display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
  font-size: 12px; color: var(--text-muted); flex-wrap: wrap;
}
.period-meta strong { color: var(--text-primary); font-weight: 600; }
.period-meta-cache { background: var(--bg-filter); padding: 2px 8px; border-radius: 10px; }
.period-meta-fresh { background: var(--green-subtle); color: var(--green); padding: 2px 8px; border-radius: 10px; font-weight: 600; }

.period-card {
  background: var(--bg-card); border: 1px solid var(--border-card);
  border-radius: var(--radius-card); padding: 18px 20px;
}
.period-summary {
  font-size: 14px; color: var(--text-secondary); line-height: 1.7;
  margin-bottom: 16px; padding: 12px 14px; background: var(--bg-primary);
  border-left: 3px solid var(--purple); border-radius: 6px;
}
.period-themes-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
.period-themes {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px; margin-bottom: 16px;
}
.period-theme {
  background: var(--bg-primary); padding: 10px 12px; border-radius: 8px;
  border-left: 3px solid var(--yellow);
}
.period-theme-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; line-height: 1.4; }
.period-theme-detail { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

.period-sectors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.period-sector-group {
  background: var(--bg-primary); padding: 12px 14px; border-radius: 8px;
}
.period-sector-group.bullish { border-left: 3px solid var(--green); }
.period-sector-group.bearish { border-left: 3px solid var(--red); }
.period-sector-group-title {
  font-size: 13px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.period-sector-group.bullish .period-sector-group-title { color: var(--green); }
.period-sector-group.bearish .period-sector-group-title { color: var(--red); }
.period-sector-row {
  display: grid; grid-template-columns: 70px 1fr 40px;
  align-items: center; gap: 8px; padding: 5px 0; font-size: 12px;
}
.period-sector-name { color: var(--text-primary); font-weight: 600; }
.period-sector-bar {
  height: 6px; background: var(--bg-card); border-radius: 3px; overflow: hidden;
}
.period-sector-bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.3s;
}
.period-sector-group.bullish .period-sector-bar-fill { background: var(--green); }
.period-sector-group.bearish .period-sector-bar-fill { background: var(--red); }
.period-sector-conf { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.period-sector-reason { grid-column: 1 / -1; font-size: 11px; color: var(--text-muted); padding: 2px 0 6px 0; line-height: 1.5; }

@media (max-width: 768px) {
  .period-sectors { grid-template-columns: 1fr; }
  .period-section { padding: 12px 16px 0; }
}
</style>

<script defer src="/static/shared-ui.js"></script>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo"><div class="logo-icon">🧠</div>AI 市场洞察</div>
    <div class="nav-links">
      <a href="/" class="nav-link">看板</a>
      <a href="/analytics" class="nav-link">分析</a>
      <a href="/timeline" class="nav-link active">洞察</a>
      <a href="/map" class="nav-link">地图</a>
      <a href="/graph" class="nav-link">关系图</a>
      <a href="/graph3d" class="nav-link">3D 图谱</a>
      <a href="/system" class="nav-link">系统</a>
      <a href="/history" class="nav-link">📜 历史</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="clock" id="clock">--:--:--</div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <button class="refresh-btn" onclick="loadAll()">🔄 刷新</button>
  </div>
</div>

<!-- 多周期 AI 洞察（独立 section，独立 fetch/渲染） -->
<section class="period-section" id="periodSection">
  <div class="period-header">
    <div class="period-title">🧠 AI 周期洞察 · 多空板块预测</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="period-tabs" id="periodTabs">
        <button class="period-tab" data-period="daily">每日</button>
        <button class="period-tab" data-period="3day">3 日</button>
        <button class="period-tab" data-period="weekly">每周</button>
        <button class="period-tab" data-period="monthly">每月</button>
      </div>
      <button class="period-refresh" id="periodRefresh">🔄 重新生成</button>
    </div>
  </div>
  <div class="period-content" id="periodContent">
    <div class="period-loading">正在加载周期洞察...</div>
  </div>
</section>

<!-- Main -->
<div class="main-content" id="mainContent">
  <div class="empty-state">
    <div class="empty-icon">🧠</div>
    <div class="empty-title">正在加载 AI 洞察...</div>
    <div class="empty-text">系统正在分析市场事件之间的关联</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────
let globalNarrative = null;

// ── Load Data ──────────────────────────────────────────────
async function loadAll() {
  const hours = 24;
  showToast('正在分析市场洞察...');

  try {
    const resp = await fetch(`/api/global_narrative?hours=${hours}`);
    const data = await resp.json();

    if (data.source === 'none') {
      globalNarrative = null;
    } else {
      globalNarrative = data;
    }

    renderAll();
    showToast(globalNarrative ? '洞察加载完成' : '暂无数据');
  } catch (e) {
    showToast('加载失败: ' + e.message);
  }
}

function renderAll() {
  const main = document.getElementById('mainContent');

  if (!globalNarrative) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔮</div>
        <div class="empty-title">暂无 AI 洞察</div>
        <div class="empty-text">系统正在生成全局洞察，请稍后再试</div>
      </div>`;
    return;
  }

  const gv = globalNarrative.global_view || {};
  const insights = globalNarrative.insights || [];
  const network = globalNarrative.symbol_network || {};
  const crossRegion = globalNarrative.cross_region_links || [];

  // Top symbols sorted by frequency
  const topSymbols = Object.entries(network)
    .sort((a, b) => b[1].length - a[1].length)
    .slice(0, 16);

  let html = '';

  // ── Stats Row ──
  const generatedAt = globalNarrative.generated_at ? new Date(globalNarrative.generated_at * 1000) : null;
  const generatedTimeStr = generatedAt ? generatedAt.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Shanghai'}) : '--:--:--';
  const nextUpdateIn = generatedAt ? getNextUpdateIn(generatedAt) : null;

  html += `
    <div class="section-title" style="margin-top: 8px;">🧠 AI 全局叙事 · 过去 24h</div>
    <div class="stats-row">
      <div class="stat-card" title="本次全局叙事分析的 24h 新闻条数（不随上方 4 周期 tab 变化）">
        <div class="stat-value">${globalNarrative.news_count || 0}</div>
        <div class="stat-label">分析新闻</div>
      </div>
      <div class="stat-card" title="本次全局叙事生成的洞察条数（下方"AI 洞察 & 影响预测"区块）">
        <div class="stat-value">${insights.length}</div>
        <div class="stat-label">条洞察</div>
      </div>
      <div class="stat-card" title="跨多条事件共现的 symbol 数（下方"跨事件关联网络"区块列出明细）">
        <div class="stat-value">${topSymbols.length}</div>
        <div class="stat-label">个跨事件符号</div>
      </div>
      <div class="stat-card" title="本次全局叙事的本地生成时间（Asia/Shanghai）">
        <div class="stat-value">${generatedTimeStr}</div>
        <div class="stat-label">生成时间</div>
      </div>
      <div class="stat-card" title="全局叙事每 6 小时自动重生成，倒计时显示距离下次刷新">
        <div class="stat-value" id="nextUpdateTimer">--</div>
        <div class="stat-label">下次更新</div>
      </div>
    </div>`;

  // ── Hero Section ──
  // 支持 gv 为数组（5条观点）或对象（旧格式1条观点）
  const viewpoints = Array.isArray(gv) ? gv : [gv];
  const first = viewpoints[0] || {};
  const risk = first.risk_level || 'low';
  const riskIcon = risk === 'high' ? '⚠️' : risk === 'medium' ? '⚡' : '✅';
  const riskText = risk === 'high' ? '高风险' : risk === 'medium' ? '中等风险' : '低风险';
  const riskDesc = risk === 'high' ? '市场波动剧烈，注意风险' : risk === 'medium' ? '市场存在不确定性' : '市场相对平稳';

  html += `
    <div class="hero-section">
      <div class="hero-header">
        <div class="hero-title">🧠 AI 全局观点</div>
        <span class="hero-badge badge-ai">🤖 AI 生成 · ${viewpoints.length} 条</span>
      </div>
      <div class="hero-theme">📌 ${first.theme || '暂无主题'}</div>
      <div class="hero-summary">${first.summary || ''}</div>
      <div class="hero-meta">
        <div class="hero-symbols">
          ${(first.key_symbols || []).map(s => `<span class="hero-symbol">${s}</span>`).join('')}
        </div>
      </div>
      <div class="hero-outlook">
        <div class="hero-outlook-label">📊 AI 市场展望</div>
        <div class="hero-outlook-text">${first.outlook || '暂无展望'}</div>
      </div>
      <div class="risk-banner ${risk}">
        <div class="risk-icon">${riskIcon}</div>
        <div class="risk-info">
          <div class="risk-label">${riskText}</div>
          <div class="risk-desc">${riskDesc}</div>
        </div>
      </div>
    </div>`;

  // 其他观点（如果有多条）
  if (viewpoints.length > 1) {
    html += `<div class="section-title">📋 其他市场观点</div>`;
    html += `<div class="viewpoints-grid">`;
    for (let i = 1; i < viewpoints.length; i++) {
      const v = viewpoints[i];
      const vrisk = v.risk_level || 'low';
      const vriskLabel = vrisk === 'high' ? '⚠️ 高风险' : vrisk === 'medium' ? '⚡ 中等' : '✅ 低风险';
      html += `
        <div class="viewpoint-card">
          <div class="viewpoint-header">
            <div class="viewpoint-theme">📌 ${v.theme || '暂无主题'}</div>
            <span class="viewpoint-risk ${vrisk}">${vriskLabel}</span>
          </div>
          <div class="viewpoint-summary">${v.summary || ''}</div>
          <div class="viewpoint-symbols">
            ${(v.key_symbols || []).map(s => `<span class="hero-symbol">${s}</span>`).join('')}
          </div>
          <div class="viewpoint-outlook">📊 ${v.outlook || ''}</div>
        </div>`;
    }
    html += `</div>`;
  }

  // ── Insights ──
  if (insights.length > 0) {
    html += `<div class="section-title">💡 AI 洞察 & 影响预测</div>`;
    html += `<div class="insights-grid">`;
    for (const ins of insights) {
      const impact = getImpact(ins);
      html += `
        <div class="insight-card type-${ins.type || 'correlation'}">
          <div class="insight-impact ${impact.class}">${impact.label}</div>
          <div class="insight-type">${getTypeLabel(ins.type)}</div>
          <div class="insight-title">${ins.title || '无标题'}</div>
          <div class="insight-desc">${ins.description || ''}</div>
          ${ins.impact_prediction ? `
          <div class="insight-prediction">📍 影响预测：${ins.impact_prediction}</div>
          ` : ''}
          <div class="insight-footer">
            <div class="insight-symbols">
              ${(ins.symbols || []).slice(0, 3).map(s => `<span class="insight-symbol">${s}</span>`).join('')}
            </div>
            ${ins.confidence ? `<div class="insight-confidence">${(ins.confidence * 100).toFixed(0)}% 置信</div>` : ''}
          </div>
        </div>`;
    }
    html += `</div>`;
  }

  // ── Symbol Network ──
  if (topSymbols.length > 0) {
    html += `
      <div class="symbol-network">
        <div class="section-title">🔗 跨事件关联网络</div>
        <div class="symbol-list">
          ${topSymbols.map(([sym, ids]) => `
            <div class="symbol-node" title="${ids.length} 条相关新闻">
              <span class="symbol-name">${sym}</span>
              <span class="symbol-count">${ids.length} 条</span>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  // ── Cross Region ──
  if (crossRegion.length > 0) {
    html += `
      <div class="cross-region">
        <div class="section-title">🌍 跨区域关联</div>
        ${crossRegion.slice(0, 6).map(link => `
          <div class="region-link">
            <div class="region-dot"></div>
            <div class="region-names">
              <span class="region-name">${link.region_1}</span>
              <span class="region-arrow">↔</span>
              <span class="region-name">${link.region_2}</span>
            </div>
            <span class="region-count-badge">${link.shared_events} 条共同</span>
          </div>
        `).join('')}
      </div>`;
  }

  main.innerHTML = html;

  // 启动下次更新时间倒计时
  if (nextUpdateIn !== null) {
    startNextUpdateTimer(nextUpdateIn);
  }
}

function getNextUpdateIn(generatedAt) {
  // AI 全局叙事每 6 小时更新一次
  const INTERVAL = 6 * 60 * 60 * 1000; // 6 小时
  const now = Date.now();
  const nextUpdate = generatedAt.getTime() + INTERVAL;
  return Math.max(0, nextUpdate - now);
}

let updateTimerInterval = null;
function startNextUpdateTimer(msRemaining) {
  if (updateTimerInterval) clearInterval(updateTimerInterval);

  function updateTimer() {
    const el = document.getElementById('nextUpdateTimer');
    if (!el) return;

    msRemaining -= 1000;
    if (msRemaining <= 0) {
      el.textContent = '即将更新';
      clearInterval(updateTimerInterval);
      // 时间到了就重新加载
      loadAll();
    } else {
      const hours = Math.floor(msRemaining / 3600000);
      const minutes = Math.floor((msRemaining % 3600000) / 60000);
      const seconds = Math.floor((msRemaining % 60000) / 1000);
      if (hours > 0) {
        el.textContent = `${hours}时${minutes}分`;
      } else if (minutes > 0) {
        el.textContent = `${minutes}分${seconds}秒`;
      } else {
        el.textContent = `${seconds}秒`;
      }
    }
  }

  updateTimer();
  updateTimerInterval = setInterval(updateTimer, 1000);
}

function getImpact(ins) {
  const type = ins.type || '';
  const urgency = ins.urgency || 'low';
  const confidence = ins.confidence || 0.5;

  if (type === 'warning' || urgency === 'high') {
    return { label: '⚠️ 预警', class: 'impact-warning' };
  }
  if (type === 'correlation') {
    // 高置信度的关联可能是市场信号
    if (confidence >= 0.7) {
      return { label: '📈 关联', class: 'impact-bullish' };
    }
    return { label: '📊 关联', class: 'impact-volatility' };
  }
  if (type === 'anomaly') {
    return { label: '🔄 波动', class: 'impact-volatility' };
  }
  if (type === 'surveillance') {
    return { label: '👁️ 监控', class: 'impact-volatility' };
  }
  return { label: '📊 信号', class: 'impact-volatility' };
}

function getTypeLabel(type) {
  const labels = {
    correlation: '🔗 关联发现',
    warning: '⚠️ 预警信号',
    surveillance: '👁️ 市场监控',
    anomaly: '❓ 异常模式',
  };
  return labels[type] || '📊 洞察';
}

// ── 多周期 AI 洞察 ─────────────────────────────────────
let currentPeriod = 'daily';

async function loadPeriod(period, forceRegen = false) {
  currentPeriod = period;
  // 更新 tab 状态
  document.querySelectorAll('.period-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.period === period);
  });
  const content = document.getElementById('periodContent');
  const refreshBtn = document.getElementById('periodRefresh');
  if (refreshBtn) refreshBtn.disabled = true;
  content.innerHTML = '<div class="period-loading">⏳ 加载中...</div>';

  try {
    const url = forceRegen
      ? `/api/insights/generate?period=${period}`
      : `/api/insights/period?period=${period}`;
    const method = forceRegen ? 'POST' : 'GET';
    const resp = await fetch(url, { method });
    const data = await resp.json();
    renderPeriod(data);
  } catch (e) {
    content.innerHTML = `<div class="period-error">❌ 加载失败: ${e.message}</div>`;
  } finally {
    if (refreshBtn) refreshBtn.disabled = false;
  }
}

function renderPeriod(data) {
  const content = document.getElementById('periodContent');
  if (!data || !data.ok) {
    const err = (data && data.error) || '未知错误';
    content.innerHTML = `<div class="period-error">⚠️ 暂无数据: ${err}</div>`;
    return;
  }

  const periodLabels = { daily: '每日洞察', '3day': '近 3 日洞察', weekly: '本周洞察', monthly: '本月洞察' };
  const periodRange = {
    daily: '过去 24 小时',
    '3day': '过去 3 天',
    weekly: '过去 7 天',
    monthly: '过去 30 天',
  };
  const period = data.period || currentPeriod;
  const label = periodLabels[period] || period;
  const range = periodRange[period] || '';
  const generated = data.generated_at ? new Date(data.generated_at * 1000) : null;
  const ageHrs = generated ? ((Date.now() / 1000 - data.generated_at) / 3600).toFixed(1) : null;
  const fromCache = data.from_cache === true;
  const summary = data.ai_summary || '(无摘要)';
  const themes = data.ai_themes || [];
  const bull = data.bullish_sectors || [];
  const bear = data.bearish_sectors || [];
  const market = data.market_breakdown || {};
  const newsCount = data.news_count || 0;
  const provider = data.provider_breakdown || [];

  // 板块渲染
  const renderSectors = (list, kind) => {
    if (!list.length) return `<div style="color:var(--text-muted);font-size:12px;padding:6px 0;">无</div>`;
    return list.map(s => `
      <div class="period-sector-row">
        <div class="period-sector-name">${escapeHtml(s.sector || '?')}</div>
        <div class="period-sector-bar">
          <div class="period-sector-bar-fill" style="width:${Math.min(100, s.confidence || 0)}%"></div>
        </div>
        <div class="period-sector-conf">${s.confidence ?? 0}</div>
        <div class="period-sector-reason">${escapeHtml(s.reason || '')}</div>
      </div>
    `).join('');
  };

  // 主题渲染
  const renderThemes = () => themes.map((t, i) => `
    <div class="period-theme">
      <div class="period-theme-title">${i + 1}. ${escapeHtml(t.title || '?')}</div>
      <div class="period-theme-detail">${escapeHtml(t.detail || '')}</div>
    </div>
  `).join('');

  // 顶部市场概况（market + provider 摘要）
  const topMarkets = Object.entries(market).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topProviders = provider.slice(0, 3).map(p => `${escapeHtml(p[0])} (${p[1]})`).join(' · ');

  content.innerHTML = `
    <div class="period-meta">
      <strong>${label}</strong>
      <span>${range}</span>
      <span>·</span>
      <span>${newsCount.toLocaleString()} 条新闻</span>
      ${topProviders ? `<span>·</span><span>Top: ${topProviders}</span>` : ''}
      ${ageHrs !== null ? `<span>·</span><span>生成于 ${ageHrs}h 前</span>` : ''}
      <span class="${fromCache ? 'period-meta-cache' : 'period-meta-fresh'}">${fromCache ? '缓存' : '新生成'}</span>
    </div>
    <div class="period-card">
      <div class="period-summary">${escapeHtml(summary)}</div>
      ${themes.length ? `<div class="period-themes-title">🎯 核心主题（${themes.length}）</div><div class="period-themes">${renderThemes()}</div>` : ''}
      <div class="period-sectors">
        <div class="period-sector-group bullish">
          <div class="period-sector-group-title">🟢 看多板块（${bull.length}）</div>
          ${renderSectors(bull, 'bullish')}
        </div>
        <div class="period-sector-group bearish">
          <div class="period-sector-group-title">🔴 看空板块（${bear.length}）</div>
          ${renderSectors(bear, 'bearish')}
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bindPeriodEvents() {
  document.querySelectorAll('.period-tab').forEach(t => {
    t.addEventListener('click', () => {
      if (t.classList.contains('disabled')) return;
      const p = t.dataset.period;
      if (p === currentPeriod) {
        // 同 tab 再点 → 强制刷新
        loadPeriod(p, true);
        return;
      }
      loadPeriod(p, false);
    });
  });
  document.getElementById('periodRefresh').addEventListener('click', () => {
    loadPeriod(currentPeriod, true);
  });
}

// ── Toast & Clock ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false});
}

// ── Init ──────────────────────────────────────────────────
function init() {
  updateClock();
  setInterval(updateClock, 1000);
  loadAll();
  setInterval(loadAll, 60000);
  // 多周期洞察：默认 daily，缓存 6h 内不重新生成
  bindPeriodEvents();
  loadPeriod('daily', false);
  // 30 分钟自动刷新一次（保持缓存新鲜度）
  setInterval(() => loadPeriod(currentPeriod, false), 30 * 60 * 1000);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else { init(); }
</script>
</body>
</html>
