<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV News — 全球事件地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root {
  --bg-primary:    #0d0e14;
  --bg-card:       #12131e;
  --bg-card-hover: #181928;
  --bg-filter:     #0f1019;
  --border:        rgba(113,50,245,0.15);
  --border-card:   rgba(113,50,245,0.12);
  --purple:        #7132f5;
  --purple-dark:   #5741d8;
  --purple-subtle: rgba(113,50,245,0.12);
  --green:         #149e61;
  --green-subtle:  rgba(20,158,97,0.14);
  --red:           #e84040;
  --red-subtle:    rgba(232,64,64,0.14);
  --yellow:        #f5a623;
  --yellow-subtle: rgba(245,166,35,0.14);
  --text-primary:  #ffffff;
  --text-secondary:#9497a9;
  --text-muted:    #5c5f75;
  --font-ui:      'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Top Bar ── */
.topbar {
  background: rgba(13,14,20,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; z-index: 1000;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.logo-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.nav-links { display: flex; gap: 4px; }
.nav-link { padding: 6px 14px; border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--text-secondary); text-decoration: none; transition: all 0.2s; }
.nav-link:hover { background: var(--purple-subtle); color: var(--purple); }
.nav-link.active { background: var(--purple-subtle); color: var(--purple); }
.topbar-right { display: flex; align-items: center; gap: 16px; }
.clock { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.live-badge { display: flex; align-items: center; gap: 5px; background: var(--green-subtle); border: 1px solid rgba(20,158,97,0.3); border-radius: 20px; padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--green); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse-dot 1.5s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(0.75); } }
.refresh-btn { background: var(--purple-subtle); border: 1px solid var(--border); color: var(--purple); border-radius: 12px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.refresh-btn:hover { background: var(--purple); color: #fff; }

/* ── Filter Bar ── */
.filter-bar {
  background: var(--bg-filter);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 16px;
  flex-shrink: 0; flex-wrap: wrap;
}
.filter-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.hours-select { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); border-radius: 12px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
.region-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); transition: all 0.2s; }
.chip:hover { border-color: var(--purple); color: var(--purple); }
.chip.active { background: var(--purple-subtle); border-color: var(--purple); color: var(--purple); }

/* ── Main ── */
.main-content { flex: 1; display: flex; overflow: hidden; }

/* ── Map ── */
#map { flex: 1; background: #0a0b10; }

/* ── Side Panel ── */
.side-panel { width: 340px; background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.panel-header { padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.panel-subtitle { font-size: 11px; color: var(--text-muted); }
.panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }

/* ── Summary Card ── */
.summary-card { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.summary-title { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat-box { background: var(--bg-card); border-radius: 10px; padding: 10px; text-align: center; }
.stat-number { font-size: 22px; font-weight: 800; line-height: 1; }
.stat-unit { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
.stat-box.high-light { border: 1px solid rgba(232,64,64,0.3); }
.stat-box.high-light .stat-number { color: var(--red); }

/* ── Region Bar ── */
.region-bars { display: flex; flex-direction: column; gap: 6px; }
.region-bar-row { display: flex; align-items: center; gap: 8px; }
.region-bar-label { font-size: 12px; width: 70px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
.region-bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.region-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.region-bar-count { font-size: 11px; color: var(--text-muted); width: 40px; text-align: right; flex-shrink: 0; }

/* ── Symbol Tags ── */
.symbol-section { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.symbol-title { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.symbol-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.symbol-tag { background: var(--purple-subtle); border: 1px solid var(--border); color: var(--purple); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }
.symbol-tag .tag-count { opacity: 0.6; font-weight: 400; margin-left: 2px; }

/* ── Flash Events ── */
.flash-section { background: var(--bg-primary); border: 1px solid rgba(232,64,64,0.2); border-radius: 14px; padding: 14px; }
.flash-title { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
.flash-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse-dot 1s ease-in-out infinite; }
.flash-item { font-size: 12px; color: var(--text-secondary); padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.4; }
.flash-item:last-child { border-bottom: none; }

/* ── City List ── */
.city-section { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.city-title { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.city-row { display: flex; align-items: center; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background 0.15s; border-radius: 6px; padding: 5px 6px; }
.city-row:hover { background: var(--bg-card-hover); }
.city-row:last-child { border-bottom: none; }
.city-row-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.city-row-name { flex: 1; font-size: 12px; font-weight: 600; }
.city-row-count { font-size: 11px; color: var(--text-muted); margin-left: 8px; }
.city-row-urg { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 600; margin-left: 6px; }

/* ── Toast ── */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; font-size: 13px; color: var(--text-primary); box-shadow: 0 4px 24px rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; z-index: 2000; }
.toast.show { opacity: 1; }

/* ── Leaflet ── */
.leaflet-popup-content-wrapper { background: var(--bg-card) !important; border: 1px solid var(--border) !important; border-radius: 16px !important; color: var(--text-primary) !important; box-shadow: 0 4px 24px rgba(0,0,0,0.5) !important; }
.leaflet-popup-tip { background: var(--bg-card) !important; }
.leaflet-popup-content { margin: 12px 14px !important; }
.leaflet-container { background: #0a0b10 !important; font-family: var(--font-ui) !important; }
.leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text-secondary) !important; border-color: var(--border) !important; }
.leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
.popup-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.popup-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.popup-symbols { font-size: 11px; color: var(--purple); font-weight: 600; margin-top: 6px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
<link rel="stylesheet" href="/static/shared-ui.css">
<script defer src="/static/shared-ui.js"></script>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo"><div class="logo-icon">🌐</div>全球事件地图</div>
    <div class="nav-links">
      <a href="/" class="nav-link">看板</a>
      <a href="/analytics" class="nav-link">分析</a>
      <a href="/timeline" class="nav-link">洞察</a>
      <a href="/map" class="nav-link active">地图</a>
    </div>
  </div>
  <div class="topbar-right">
    <div class="clock" id="clock">--:--:--</div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <button class="refresh-btn" onclick="loadMapData()">刷新</button>
  </div>
</div>

<!-- Filter Bar -->
<div class="filter-bar">
  <span class="filter-label">时间</span>
  <select class="hours-select" id="hoursSelect" onchange="loadMapData()">
    <option value="6">最近 6 小时</option>
    <option value="12">最近 12 小时</option>
    <option value="24" selected>最近 24 小时</option>
    <option value="48">最近 48 小时</option>
  </select>
  <span class="filter-label">区域</span>
  <div class="region-chips" id="regionChips">
    <span class="chip active" data-region="all" onclick="toggleRegion(this)">全部</span>
    <span class="chip" data-region="Europe" onclick="toggleRegion(this)">🌍 欧洲</span>
    <span class="chip" data-region="Asia" onclick="toggleRegion(this)">🌏 亚洲</span>
    <span class="chip" data-region="North America" onclick="toggleRegion(this)">🌎 北美</span>
    <span class="chip" data-region="Middle East" onclick="toggleRegion(this)">🕌 中东</span>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  <div id="map"></div>

  <div class="side-panel">
    <div class="panel-header">
      <div class="panel-title">📍 全球事件热力</div>
      <div class="panel-subtitle" id="panelSubtitle">加载中...</div>
    </div>
    <div class="panel-body" id="panelBody">
      <div style="display:flex;align-items:center;justify-content:center;height:120px;color:var(--text-muted);font-size:13px;">正在加载...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── State ─────────────────────────────────────────────────
let map;
let markers = [];
let geoData = [];
let selectedRegion = 'all';
let currentData = {}; // 聚合后的数据供侧边栏使用

const REGION_COLORS = {
  'Europe': '#149e61',
  'Asia': '#f5a623',
  'North America': '#7132f5',
  'Middle East': '#e84040',
  'South America': '#f5a623',
  'Other': '#9497a9',
};
const REGION_FLAGS = {
  'Europe': '🌍', 'Asia': '🌏', 'North America': '🌎',
  'Middle East': '🕌', 'South America': '🌎', 'Other': '🌐',
};
const REGION_NAMES = {
  'Europe': '欧洲', 'Asia': '亚洲', 'North America': '北美',
  'Middle East': '中东', 'South America': '南美', 'Other': '其他',
};

function getRegionColor(r) { return REGION_COLORS[r] || REGION_COLORS['Other']; }
function urgencyLabel(s) { return s >= 2 ? '高' : s >= 1 ? '中' : '低'; }
function urgencyColor(s) { return s >= 2 ? 'var(--red)' : s >= 1 ? 'var(--yellow)' : 'var(--text-muted)'; }

// ── Init Map ──────────────────────────────────────────────
function initMap() {
  map = L.map('map', { center: [20, 0], zoom: 2, minZoom: 1, maxZoom: 8, zoomControl: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO', subdomains: 'abcd', maxZoom: 19,
  }).addTo(map);
}

// ── Load Data ──────────────────────────────────────────────
async function loadMapData() {
  const hours = parseInt(document.getElementById('hoursSelect').value);
  try {
    const resp = await fetch(`/api/geo_news?hours=${hours}`);
    const data = await resp.json();
    geoData = data.items || [];
    renderMarkers();
    renderSidePanel();
  } catch (e) {
    showToast('加载失败: ' + e.message);
  }
}

// ── Render Map Markers ──────────────────────────────────────
function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const cityMap = {};
  geoData.forEach(e => {
    const key = e.location || 'Unknown';
    if (!cityMap[key]) {
      cityMap[key] = { lat: e.lat, lng: e.lng, name: key, region: e.region || 'Other', country: e.country || '', urgency: 0, news_count: 0, news: [] };
    }
    cityMap[key].urgency = Math.max(cityMap[key].urgency, e.urgency || 1);
    cityMap[key].news_count++;
    if (e.title) cityMap[key].news.push(e);
  });
  const cities = Object.values(cityMap).filter(c => c.lat && c.lng);
  const filtered = selectedRegion === 'all' ? cities : cities.filter(c => c.region === selectedRegion);

  filtered.forEach(city => {
    const fNews = geoData.filter(e => (e.location || 'Unknown') === city.name && (selectedRegion === 'all' || e.region === selectedRegion));
    const count = fNews.length;
    const baseRadius = Math.sqrt(count) * 3; // 用平方根让大小更合理
    const r = Math.max(10, Math.min(50, baseRadius));

    // 渐变光晕效果：用双层圆
    const color = getRegionColor(city.region);

    // 内层实心圆（高亮核心）
    const inner = L.circleMarker([city.lat, city.lng], {
      radius: r * 0.4,
      fillColor: color,
      color: 'rgba(255,255,255,0.8)',
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.9,
    });

    // 外层光晕（低透明度）
    const outer = L.circleMarker([city.lat, city.lng], {
      radius: r,
      fillColor: color,
      color: 'transparent',
      weight: 0,
      opacity: 0,
      fillOpacity: 0.15,
    });

    // 聚合 symbols 和市场
    const allSymbols = {};
    const markets = new Set();
    let flashCount = 0;
    let highUrgency = 0;
    const topTitles = [];
    fNews.slice(0, 5).forEach((n, idx) => {
      if (n.title) topTitles.push(n.title);
      if (n.urgency >= 2) highUrgency++;
      if (n.is_flash) flashCount++;
      if (n.symbols && Array.isArray(n.symbols)) {
        n.symbols.forEach(s => {
          const t = s.split(':').pop();
          allSymbols[t] = (allSymbols[t] || 0) + 1;
        });
      }
      if (n.market) markets.add(n.market);
    });
    const topSyms = Object.entries(allSymbols).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const symStr = topSyms.map(([t, c]) => c > 1 ? `${t}(${c})` : t).join(' · ');
    const marketStr = Array.from(markets).slice(0, 3).join(', ');
    const urgLabel = highUrgency > 5 ? '🔴 高' : highUrgency > 0 ? '🟡 中' : '⚪ 低';
    const titleList = topTitles.slice(0, 3).map(t => `<div style="font-size:11px;color:#9497a9;margin-top:4px;line-height:1.4">• ${t.length > 70 ? t.substring(0, 70) + '…' : t}</div>`).join('');

    inner.bindPopup(`
      <div class="popup-title">${REGION_FLAGS[city.region]} ${city.name}</div>
      ${titleList}
      <div class="popup-meta" style="margin-top:8px">${urgLabel} · ${count} 条事件 · ${flashCount} 快讯${marketStr ? ' · ' + marketStr : ''}</div>
      ${symStr ? `<div class="popup-symbols">🏷️ ${symStr}</div>` : ''}
    `, { maxWidth: 300 });
    inner.on('click', () => { selectedRegion = city.region; document.querySelectorAll('[data-region]').forEach(c => c.classList.remove('active')); document.querySelector(`[data-region="${city.region}"]`).classList.add('active'); renderSidePanel(); });

    inner.addTo(map);
    outer.addTo(map);
    markers.push(inner, outer);
  });
}

// ── Render Side Panel ──────────────────────────────────────
function renderSidePanel() {
  const body = document.getElementById('panelBody');
  const subtitle = document.getElementById('panelSubtitle');

  // 聚合
  const cityMap = {};
  const regionStats = {};
  const allSymbols = {};
  const flashEvents = [];
  let totalEvents = 0;
  let totalFlash = 0;
  let totalCities = 0;

  geoData.forEach(e => {
    if (selectedRegion !== 'all' && e.region !== selectedRegion) return;
    const key = e.location || 'Unknown';
    if (!cityMap[key]) {
      cityMap[key] = { lat: e.lat, lng: e.lng, name: key, region: e.region || 'Other', urgency: 0, news_count: 0 };
      totalCities++;
    }
    cityMap[key].urgency = Math.max(cityMap[key].urgency, e.urgency || 1);
    cityMap[key].news_count++;
    totalEvents++;

    const reg = e.region || 'Other';
    regionStats[reg] = (regionStats[reg] || 0) + 1;

    if (e.symbols && Array.isArray(e.symbols)) {
      e.symbols.forEach(s => {
        const t = s.split(':').pop();
        allSymbols[t] = (allSymbols[t] || 0) + 1;
      });
    }
    if (e.is_flash) {
      totalFlash++;
      if (flashEvents.length < 5) flashEvents.push(e.title || '快讯');
    }
  });

  if (totalEvents === 0) {
    body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:120px;color:var(--text-muted);font-size:13px);">暂无数据</div>';
    subtitle.textContent = '没有找到事件';
    return;
  }

  subtitle.textContent = `${totalCities} 个城市 · ${totalEvents} 条事件`;

  const topSymbols = Object.entries(allSymbols).sort((a, b) => b[1] - a[1]).slice(0, 20);
  const topCities = Object.values(cityMap).sort((a, b) => b.news_count - a.news_count).slice(0, 15);
  const maxCount = Math.max(...Object.values(regionStats), 1);

  const regionOrder = ['North America', 'Europe', 'Asia', 'Middle East', 'South America', 'Other'];
  const sortedRegions = regionOrder.filter(r => regionStats[r]).map(r => ({ region: r, count: regionStats[r] }));

  body.innerHTML = `
    <!-- 总览 -->
    <div class="summary-card">
      <div class="summary-title">📊 事件总览</div>
      <div class="summary-stats">
        <div class="stat-box">
          <div class="stat-number" style="color:var(--purple)">${totalEvents}</div>
          <div class="stat-unit">事件总数</div>
        </div>
        <div class="stat-box ${totalFlash > 0 ? 'high-light' : ''}">
          <div class="stat-number">${totalFlash}</div>
          <div class="stat-unit">快讯</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" style="color:var(--green)">${totalCities}</div>
          <div class="stat-unit">城市</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" style="color:var(--yellow)">${topSymbols.length}</div>
          <div class="stat-unit">关联标的</div>
        </div>
      </div>
      ${sortedRegions.length > 0 ? `<div class="region-bars">` + sortedRegions.map(r => {
        const pct = Math.round((r.count / maxCount) * 100);
        return `<div class="region-bar-row">
          <div class="region-bar-label">${REGION_FLAGS[r.region]} ${REGION_NAMES[r.region]}</div>
          <div class="region-bar-track"><div class="region-bar-fill" style="width:${pct}%;background:${getRegionColor(r.region)}"></div></div>
          <div class="region-bar-count">${r.count}</div>
        </div>`;
      }).join('') + `</div>` : ''}
    </div>

    ${topSymbols.length > 0 ? `<div class="symbol-section">
      <div class="symbol-title">🔥 热门标的</div>
      <div class="symbol-tags">` + topSymbols.slice(0, 15).map(([t, c]) =>
        `<span class="symbol-tag">${t}<span class="tag-count">${c > 1 ? c : ''}</span></span>`
      ).join('') + `</div>
    </div>` : ''}

    ${flashEvents.length > 0 ? `<div class="flash-section">
      <div class="flash-title"><div class="flash-dot"></div>⚡ 快讯</div>
      ${flashEvents.slice(0, 4).map(t => `<div class="flash-item">${t.length > 60 ? t.substring(0, 60) + '…' : t}</div>`).join('')}
    </div>` : ''}

    ${topCities.length > 0 ? `<div class="city-section">
      <div class="city-title">📍 城市热度</div>
      ${topCities.map(c => {
        const col = getRegionColor(c.region);
        const uc = urgencyColor(c.urgency);
        return `<div class="city-row" onclick="flyToCity('${c.name.replace(/'/g, "\\'")}')">
          <div class="city-row-dot" style="background:${col}"></div>
          <div class="city-row-name">${REGION_FLAGS[c.region] || ''} ${c.name}</div>
          <div class="city-row-count">${c.news_count}</div>
          <div class="city-row-urg" style="background:${uc}20;color:${uc}">${urgencyLabel(c.urgency)}</div>
        </div>`;
      }).join('')}
    </div>` : ''}
  `;
}

function flyToCity(name) {
  const city = Object.values(
    geoData.reduce((acc, e) => {
      const key = e.location || 'Unknown';
      if (!acc[key]) acc[key] = { lat: e.lat, lng: e.lng, name: key };
      return acc;
    }, {})
  ).find(c => c.name === name);
  if (city) map.flyTo([city.lat, city.lng], 5, { duration: 0.8 });
}

function toggleRegion(el) {
  document.querySelectorAll('[data-region]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedRegion = el.dataset.region;
  renderMarkers();
  renderSidePanel();
}

// ── Toast & Clock ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false});
}

// ── Init ──────────────────────────────────────────────────
function init() {
  initMap();
  updateClock();
  setInterval(updateClock, 1000);
  loadMapData();
  setInterval(loadMapData, 60000);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else { init(); }
</script>
</body>
</html>
